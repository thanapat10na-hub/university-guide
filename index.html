<head>
  <meta charset="UTF-8">
  <title>🎓 University Guide for High School</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="คู่มือเลือกเรียนต่อมหาวิทยาลัยสำหรับนักเรียนม.ปลาย ตามสายการเรียน">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <style>
    :root {
      --primary: #0d9488;
      --primary-dark: #0b7a70;
      --bg-light: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Sarabun', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f0f9ff, #e0f2fe, #f8fafc);
      text-align: center;
      padding: 20px 15px;
      color: var(--text);
      line-height: 1.6;
      margin: 0;
    }

    header {
      background: var(--primary);
      color: #fff;
      padding: 28px 20px;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(13, 148, 136, 0.2);
      max-width: 720px;
      margin: 0 auto 30px;
      transition: transform 0.3s ease;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.9em;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    select {
      padding: 14px 20px;
      font-size: 17px;
      border-radius: 999px;
      border: 2px solid var(--primary);
      background: #ecfdf5;
      color: #065f46;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      width: 90%;
      max-width: 420px;
      font-family: inherit;
      transition: all 0.25s ease;
    }
    select:hover {
      box-shadow: 0 6px 14px rgba(0,0,0,0.1);
    }

    .back {
      margin: 15px auto;
      display: none;
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(13,148,136,0.3);
      transition: all 0.3s ease;
    }
    .back:hover {
      background: var(--primary-dark);
      transform: scale(1.04);
    }

    /* Grid: 2 (mobile), 3 (tablet), 4 (desktop) */
    .major-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      margin-top: 20px;
      opacity: 0;
      animation: fadeInGrid 0.6s forwards;
    }

    @media (min-width: 600px) {
      .major-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    @media (min-width: 900px) {
      .major-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @keyframes fadeInGrid {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .major-card {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
      text-align: center;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
      height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeInCard 0.5s forwards;
    }

    /* Staggered animation */
    .major-card:nth-child(1) { animation-delay: 0.1s; }
    .major-card:nth-child(2) { animation-delay: 0.15s; }
    .major-card:nth-child(3) { animation-delay: 0.2s; }
    .major-card:nth-child(4) { animation-delay: 0.25s; }
    .major-card:nth-child(5) { animation-delay: 0.3s; }
    .major-card:nth-child(6) { animation-delay: 0.35s; }
    .major-card:nth-child(7) { animation-delay: 0.4s; }
    .major-card:nth-child(8) { animation-delay: 0.45s; }

    @keyframes fadeInCard {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .major-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 14px 28px rgba(0,0,0,0.12);
      border-color: #cbd5e1;
    }

    .major-card img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 12px;
      transition: transform 0.3s ease;
    }
    .major-card:hover img {
      transform: scale(1.05);
    }

    .major-card h3 {
      margin: 0;
      font-size: 1.05em;
      font-weight: 700;
      color: var(--text);
      text-align: center;
    }

    .detail-container {
      display: none;
      max-width: 900px;
      margin: 25px auto;
      padding: 28px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
    }

    .detail-header {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin-bottom: 24px;
    }

    .detail-box {
      background: #f9fbfd;
      border: 2px solid var(--border);
      padding: 22px;
      border-radius: 16px;
      flex: 1;
      min-width: 250px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .detail-box h4 {
      margin: 0 0 12px;
      font-size: 1.15em;
      color: var(--primary);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .unilist a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    .unilist a:hover {
      text-decoration: underline;
      color: var(--primary-dark);
    }

    ul {
      text-align: left;
      padding-left: 20px;
    }
    li {
      margin: 6px 0;
    }
  </style>
</head>
