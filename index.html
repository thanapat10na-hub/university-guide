      pointer-events: none;
      z-index: -1;
    }
    header {
      background: #0d9488;
      color: #fff;
      padding: 24px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      position: relative;
      overflow: hidden;
      max-width: 700px;
      margin: 0 auto 25px;
    }
    header::after {
      content: "";
      position: absolute;
      top: -50px; right: -50px;
      width: 150px; height: 150px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.8em;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    h1 svg {
      width: 26px;
      height: 26px;
    }
    select {
      padding: 12px 18px;
      font-size: 17px;
      border-radius: 999px;
      border: 2px solid #0d9488;
      background: #ecfdf5;
      color: #065f46;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: all 0.2s;
      width: 90%;
      max-width: 400px;
    }
    select:hover {
      border-color: #067d72;
      transform: scale(1.02);
    }
    #results {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: #fff;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      text-align: left;
      animation: fadeUp .4s ease both;
      border: 1px solid #e2e8f0;
      transition: all 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 20px rgba(0,0,0,0.08);
      border-color: #cbd5e1;
    }
    .back {
      margin: 15px auto;
      display: none;
      background: #0d9488;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 3px 8px rgba(13,148,136,0.3);
      transition: all 0.2s;
    }
    .back:hover {
      background: #0b7a70;
      transform: scale(1.03);
    }
    .toggle {
      margin-top: 12px;
      background: #f0fdfa;
      border: 1px solid #0d9488;
      color: #065f46;
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .toggle:hover {
      background: #d1fae5;
      transform: scale(1.02);
    }
    .unilist {
      max-height: 0;
      overflow: hidden;
      transition: max-height .4s ease;
      padding-left: 20px;
      margin-top: 8px;
    }
    .unilist.open {
      max-height: 600px;
    }
    .tip-box {
      background: #dbeafe;
      border-left: 4px solid #3b82f6;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: left;
      font-size: 0.95em;
      line-height: 1.5;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    .tip-box b {
      color: #1d4ed8;
    }
    ul {
      padding-left: 22px;
      margin: 8px 0;
    }
    li {
      margin: 4px 0;
    }
    .unilist a {
      color: #0d9488;
      text-decoration: none;
      font-weight: 600;
    }
    .unilist a:hover {
      text-decoration: underline;
    }

      margin-top: 30px;
      font-size: 0.85em;
      color: #64748b;
      max-width: 700px;
      margin: 30px auto 0;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: none; }
    }
    @media (max-width: 480px) {
      h1 { font-size: 1.5em; }
      select { font-size: 16px; padding: 10px 16px; }
      .card { padding: 14px; }
    }
  </style>
</head>

const sel = document.getElementById("stream");
const res = document.getElementById("results");
const back = document.getElementById("backBtn");
const header = document.getElementById("header");

sel.onchange = () => {
  if (!data[sel.value]) return;
  header.classList.add("fadeOut");
  setTimeout(() => {
    header.style.display = "none";
    back.style.display = "inline-block";
    res.innerHTML = "";

    // 📌 แถบคำแนะนำ
    const streamName = {
      eng: "วิศวะ", cs: "วิทย์คอม", sci: "วิทย์–คณิต", mathlang: "คณิต–ภาษา",
      jp: "ศิลป์–ญี่ปุ่น", cn: "ศิลป์–จีน", kr: "ศิลป์–เกาหลี", soc: "ไทย–สังคม"
    }[sel.value];

    const tip = {
      eng: "วิศวะมักใช้ PAT1 + PAT3 + วิชาสามัญ (คณิต/ฟิสิกส์)",
      cs: "เน้น PAT1 + คณิต1 + อังกฤษ",
      sci: "แพทย์/วิศวะ: ต้อง PAT1, PAT2, วิชาสามัญวิทย์",
      mathlang: "เศรษฐศาสตร์/บริหาร: ใช้คณิต1 + อังกฤษ + สังคม",
      jp: "ภาษาญี่ปุ่นใช้คะแนน JLPT N3 ขึ้นไป ช่วยเพิ่มโอกาส",
      cn: "ภาษาจีนใช้คะแนน HSK ระดับ 3-4 เป็นข้อได้เปรียบ",
      kr: "ภาษาเกาหลีใช้ TOPIK Level 3+ ช่วยในการสมัครทุน",
      soc: "นิติ/รัฐศาสตร์: ใช้คณิต1 + อังกฤษ + สังคม"
    }[sel.value];

    const tipBox = document.createElement("div");
    tipBox.className = "tip-box";
    tipBox.innerHTML = `📌 <b>คำแนะนำสำหรับสาย ${streamName}:</b> ${tip}`;
    res.appendChild(tipBox);

    // สร้างการ์ด
    data[sel.value].forEach(f => {
      const d = document.createElement("div");
      d.className = "card";
      d.innerHTML = `
        <h3>${f.emoji} ${f.name}</h3>
        <p><b>📚 เรียนเกี่ยวกับ:</b> ${f.about}</p>
        <p><b>🎯 อาชีพในอนาคต:</b></p>
        <ul>${f.jobs.map(j => `<li>🔸 ${j}</li>`).join("")}</ul>
        <button class="toggle" onclick="toggleUni(this)">
          🏛️ ดูมหาวิทยาลัยที่เปิดสอน
        </button>
        <div class="unilist">
          <ul>${f.universities.map(u => `<li>🎓 <a href="${u.url}" target="_blank">${u.name}</a></li>`).join("")}</ul>
        </div>
      `;
      res.appendChild(d);
    });
  }, 300);
};

back.onclick = () => {
  res.innerHTML = "";
  back.style.display = "none";
  header.style.display = "block";
  header.classList.add("fadeIn");
  setTimeout(() => {
    header.classList.remove("fadeIn");
    header.classList.remove("fadeOut");
  }, 300);
  sel.value = "";
};

function toggleUni(btn) {
  const list = btn.nextElementSibling;
  const isOpen = list.classList.contains('open');
  
  document.querySelectorAll('.unilist').forEach(el => {
    el.classList.remove('open');
    el.style.maxHeight = '0px';
  });
  
  if (!isOpen) {
    list.classList.add('open');
    list.style.maxHeight = list.scrollHeight + 'px';
  } else {
    list.classList.remove('open');
    list.style.maxHeight = '0px';
  }
}
</script>
